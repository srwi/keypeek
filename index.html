<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>KeyPeek</title>

    <link data-trunk rel="rust" href="crates/keypeek-web/Cargo.toml" data-cargo-no-default-features data-wasm-opt="2" />
    <base data-trunk-public-url />
    <link data-trunk rel="icon" href="resources/icon.png" />
    <link data-trunk rel="copy-dir" href="resources" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f8f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1b" />

    <style>
        :root {
            color-scheme: light dark;
            --bg-color: #1b1b1b;
            --text-color: #f0f0f0;
            --spinner-track: rgba(240, 240, 240, 0.2);
            --spinner-active: #ffffff;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8f8f8;
                --text-color: #2b2b2b;
                --spinner-track: rgba(0, 0, 0, 0.15);
                --spinner-active: #1b1b1b;
            }
        }

        html {
            touch-action: manipulation;
            background-color: var(--bg-color);
        }

        body {
            background-color: var(--bg-color);
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .loading-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid var(--spinner-track);
            border-top-color: var(--spinner-active);
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="keypeek_canvas"></canvas>

    <div class="loading-container" id="loading_text">
        <noscript>JavaScript is required to run KeyPeek in the browser.</noscript>
        <div class="spinner"></div>
        <p style="margin-top: 12px; font-size: 15px; opacity: 0.85;">Loading KeyPeek...</p>
    </div>
</body>
</html>
