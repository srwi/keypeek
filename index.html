<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>KeyPeek - Keyboard Layer Overlay & Keymap Editor</title>

    <link data-trunk rel="rust" data-cargo-no-default-features data-wasm-opt="2" />
    <base data-trunk-public-url />
    <link data-trunk rel="icon" href="resources/icon.png" />
    <link data-trunk rel="copy-dir" href="resources" />

    <style>
        html {
            touch-action: manipulation;
        }

        body {
            background-color: #1e1e2e;
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .loading-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #cdd6f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid rgba(205, 214, 244, 0.2);
            border-top-color: #89b4fa;
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="keypeek_canvas"></canvas>

    <div class="loading-container" id="loading_text">
        <noscript>JavaScript is required to run KeyPeek in the browser.</noscript>
        <div class="spinner"></div>
        <p style="margin-top: 12px; font-size: 15px; opacity: 0.85;">Loading KeyPeek...</p>
    </div>
</body>
</html>
