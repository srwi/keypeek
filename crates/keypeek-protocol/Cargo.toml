[package]
name = "keypeek-protocol"
description = "Hardware protocols, transports, codecs, firmware drivers, and connection state machine for KeyPeek"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["desktop"]
desktop = [
    "hidapi",
    "serialport",
    "qmk-via-api/hidapi",
    "zmk-studio-api/serial",
    "zmk-studio-api/ble",
]
hidapi = ["dep:hidapi"]
serialport = ["dep:serialport"]
test-utils = []

[dependencies]
keypeek-core = { workspace = true }
egui-phosphor = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }
futures-util = { workspace = true }
futures-channel = { workspace = true }
prost = { workspace = true }
lzma-rs = { workspace = true }
qmk-via-api = { workspace = true }
zmk-studio-api = { workspace = true }

# Desktop / native-only dependencies
hidapi = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Devices_Bluetooth",
    "Devices_Radios",
    "Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon = { workspace = true }
x11rb = { workspace = true }
wayland-client = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
log = { workspace = true }

