[workspace]
resolver = "2"
members = [
    "crates/keypeek-core",
    "crates/keypeek-protocol",
    "crates/keypeek-presentation",
    "crates/keypeek-desktop",
    "crates/keypeek-web",
]
default-members = ["crates/keypeek-desktop"]

[workspace.package]
version = "0.11.0"
edition = "2021"
authors = ["Stephan Rumswinkel"]
license = "GPL-3.0-only"
repository = "https://github.com/srwi/keypeek"

[workspace.dependencies]
keypeek-core = { path = "crates/keypeek-core" }
keypeek-protocol = { path = "crates/keypeek-protocol", default-features = false }
keypeek-presentation = { path = "crates/keypeek-presentation", default-features = false }
keypeek-desktop = { path = "crates/keypeek-desktop" }
keypeek-web = { path = "crates/keypeek-web" }

# Serialization & async
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
web-time = "1.1.0"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "channel"] }
futures-channel = "0.3"
prost = "0.14"
lzma-rs = "0.3"
qmk-via-api = { version = "0.10.0", default-features = false }
zmk-studio-api = { version = "0.6.1", default-features = false }

# GUI & Graphics
egui = "0.36.1"
eframe = { version = "0.36.1", features = ["glow"] }
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
egui-phosphor = "0.13.0"
egui-file-dialog = "0.15.0"
image = "0.25.10"
rust-ini = "0.21.3"

# Desktop native dependencies
directories = "6.0.0"
tray-icon = "0.24.2"
hidapi = { version = "2.6.5", features = ["macos-shared-device"] }
serialport = "4.10.0"
winresource = "0.1.31"
windows = "0.62.2"
xkbcommon = "0.9.0"
x11rb = { version = "0.14.0", features = ["allow-unsafe-code"] }
wayland-client = "0.31.15"

# Web dependencies
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = [
    "BinaryType",
    "Blob",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Storage",
    "Window",
    "console",
    "Navigator",
    "Hid",
    "HidDevice",
    "HidDeviceFilter",
    "HidDeviceRequestOptions",
    "HidInputReportEvent",
    "Serial",
    "SerialPort",
    "SerialOptions",
    "SerialPortRequestOptions",
    "SerialPortFilter",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }
console_error_panic_hook = "0.1.7"
log = "0.4.33"
